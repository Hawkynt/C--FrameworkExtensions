name: Release

# Stable release — MANUAL dispatch only. This is the explicit "package + publish"
# action: it runs CI, packs every NuGet package at its OWN csproj <Version> +
# commit count (stamped by scripts/version.pl), pushes them to nuget.org, then
# cuts a dated GitHub Release.
#
# Versions are never taken from a git tag. Because each package carries its own
# version, there is no single repo version, so the repo-level marker is the date:
# the Release/tag is `vyyyyMMdd`. Nightlies happen automatically (nightly.yml).
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you cutting this release? (optional, for the audit log)'
        required: false

permissions:
  contents: write

# Force JavaScript-based actions to run on Node 24 instead of the deprecated Node 20 ahead of
# the 2026-06-16 hard cutover, until we bump each action to a Node-24-native major version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    uses: ./.github/workflows/_build.yml

  publish-nuget:
    # Release-only NuGet publish. _build.yml packs the 6 packages and uploads them as the
    # `nuget-packages` artifact; the push lives here so a nightly or a plain build never ships one.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job mint the short-lived OIDC token that nuget.org's Trusted Publishing exchanges
      # for a one-hour API key. Without it the login step cannot mint a token and the push falls
      # back to the stored NUGET_TOKEN.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: dist-nuget
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      # Trusted Publishing: nuget.org exchanges a GitHub OIDC token for an API key valid one hour, so
      # no long-lived secret has to exist. It needs a policy on nuget.org (your username ▸ Trusted
      # Publishing) naming owner `Hawkynt`, repository `C--FrameworkExtensions` and workflow file
      # `release.yml`. Until that policy exists this step fails and the push below falls back to
      # NUGET_TOKEN.
      - name: NuGet login (OIDC → short-lived key)
        id: nugetlogin
        continue-on-error: true
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        env:
          OIDC_KEY: ${{ steps.nugetlogin.outputs.NUGET_API_KEY }}
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
        run: |
          if [ -n "$OIDC_KEY" ]; then
            echo "Publishing with a short-lived Trusted Publishing key."
            KEY="$OIDC_KEY"
          elif [ -n "$NUGET_TOKEN" ]; then
            echo "::warning::Trusted Publishing is not configured; falling back to the stored NUGET_TOKEN."
            KEY="$NUGET_TOKEN"
          else
            echo "::error::No publishing credential — configure Trusted Publishing or set NUGET_TOKEN."
            exit 1
          fi

          shopt -s nullglob
          pkgs=(dist-nuget/*.nupkg)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "::error::No .nupkg files found in dist-nuget/; nothing to push."
            exit 1
          fi
          for pkg in "${pkgs[@]}"; do
            echo "Pushing $(basename "$pkg")"
            dotnet nuget push "$pkg" \
              --api-key "$KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      # "Your package was pushed" only means nuget.org accepted it for validation. It can still fail
      # validation later and never become available while the push exited 0. Without this wait a
      # rejected package produces a green release.
      - name: Wait for the packages to become available
        run: |
          fail=0
          for pkg in dist-nuget/*.nupkg; do
            base=$(basename "$pkg" .nupkg)
            # "Id.1.2.3.4" -> id, version. The version is the trailing dotted-numeric run.
            version=$(echo "$base" | grep -oE '[0-9]+(\.[0-9]+)*$')
            id=${base%.$version}
            lower=$(echo "$id" | tr '[:upper:]' '[:lower:]')

            echo "Waiting for $id $version…"
            found=0
            for _ in $(seq 1 60); do
              if curl -sf "https://api.nuget.org/v3-flatcontainer/$lower/index.json" \
                   | grep -q "\"$version\""; then
                echo "  available"
                found=1
                break
              fi
              sleep 15
            done

            if [ "$found" -ne 1 ]; then
              echo "::error::$id $version was pushed but never became available on nuget.org — it likely failed validation. Check the rejection mail on the nuget.org account."
              fail=1
            fi
          done
          exit $fail

  release:
    # Also waits on publish-nuget: a dated release whose packages never reached nuget.org is a release
    # in name only, and until now a failed or rejected push still produced a green release.
    needs: [build, publish-nuget]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute release marker
        run: echo "REL=v$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update changelog + generate release notes (bucketed by + - * # !)
        run: node ".github/workflows/scripts/update-changelog.mjs" --release "$REL" --notes RELEASE_NOTES.md
      - name: Commit changelog (if it changed)
        run: |
          if ! git diff --quiet -- CHANGELOG.md; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "* update changelog for $REL [skip ci]"
            git push
          fi
          echo "REL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Create GitHub Release (dated marker; tags vyyyyMMdd at the changelog commit)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL }}
          name: ${{ env.REL }}
          target_commitish: ${{ env.REL_SHA }}
          files: dist/*.nupkg
          body_path: RELEASE_NOTES.md            # commit-message changelog, not GitHub's PR notes
