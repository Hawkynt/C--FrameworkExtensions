name: Release

# Stable release — MANUAL dispatch only. This is the explicit "package + publish"
# action: it runs CI, packs every NuGet package at its OWN csproj <Version> +
# commit count (stamped by scripts/version.pl), pushes them to nuget.org, then
# cuts a dated GitHub Release.
#
# Versions are never taken from a git tag. Because each package carries its own
# version, there is no single repo version, so the repo-level marker is the date:
# the Release/tag is `vyyyyMMdd`. Nightlies happen automatically (nightly.yml).
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you cutting this release? (optional, for the audit log)'
        required: false

permissions:
  contents: write
  pull-requests: write

# Force JavaScript-based actions to run on Node 24 instead of the deprecated Node 20 ahead of
# the 2026-06-16 hard cutover, until we bump each action to a Node-24-native major version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    uses: ./.github/workflows/_build.yml

  publish-nuget:
    # Release-only NuGet publish. _build.yml packs the 6 packages and uploads them as the
    # `nuget-packages` artifact; the push lives here so a nightly or a plain build never ships one.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job mint the short-lived OIDC token that nuget.org's Trusted Publishing exchanges
      # for a one-hour API key. Without it the login step cannot mint a token and the push falls
      # back to the stored NUGET_TOKEN.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: dist-nuget
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Publish to NuGet.org (Trusted Publishing + acceptance check)
        uses: Hawkynt/RepositoryTemplate/nuget-publish@v1
        with:
          packages-path: dist-nuget
          user: ${{ secrets.NUGET_USER }}
          nuget-token: ${{ secrets.NUGET_TOKEN }}

  release:
    # Also waits on publish-nuget: a dated release whose packages never reached nuget.org is a release
    # in name only, and until now a failed or rejected push still produced a green release.
    needs: [build, publish-nuget]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute release marker
        run: echo "REL=v$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update changelog + generate release notes (bucketed by + - * # !)
        run: node ".github/workflows/scripts/update-changelog.mjs" --release "$REL" --notes RELEASE_NOTES.md
      # main takes changes through pull requests only, so the changelog is proposed rather than
      # pushed. The release is therefore tagged at the commit the packages were actually built and
      # published from, which it should have been all along — it used to move to the changelog
      # commit, a commit containing none of the released code.
      #
      # CHANGELOG_PR_TOKEN is optional and only affects whether CI runs on the proposed change.
      # Anything done with GITHUB_TOKEN cannot trigger another workflow, so a pull request opened
      # with it arrives with no checks and cannot satisfy a required-checks rule.
      - name: Propose the changelog (if it changed)
        env:
          GH_TOKEN: ${{ secrets.CHANGELOG_PR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          rel_sha=$(git rev-parse HEAD)
          echo "REL_SHA=$rel_sha" >> "$GITHUB_ENV"
          if git diff --quiet -- CHANGELOG.md; then
            echo "The changelog is already current."
            exit 0
          fi
          branch="bot/changelog-$REL"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add CHANGELOG.md
          git commit -m "* update changelog for $REL"
          git push --force origin "$branch"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "The open pull request for $branch now carries the current changelog."
            exit 0
          fi
          gh pr create --base main --head "$branch" \
            --title "* update changelog for $REL" \
            --body "The commit-message changelog for release $REL, cut from $rel_sha."
      - name: Create GitHub Release (dated marker; tags vyyyyMMdd at the released commit)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL }}
          name: ${{ env.REL }}
          target_commitish: ${{ env.REL_SHA }}
          files: dist/*.nupkg
          body_path: RELEASE_NOTES.md            # commit-message changelog, not GitHub's PR notes
